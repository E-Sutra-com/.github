<svg width="100%" height="120" viewBox="0 0 850 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pipeBgBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
  </defs>

  <style>
    .pipe-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #64748b;
      text-transform: uppercase;
    }
    .step-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      fill: #38bdf8;
    }
    .step-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: -0.1px;
    }
    .step-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #94a3b8;
    }
  </style>

  <!-- Base Frame -->
  <rect width="850" height="120" rx="8" fill="url(#pipeBgBase)" stroke="#1e293b" stroke-width="1"/>

  <!-- Kicker Label -->
  <text x="24" y="24" class="pipe-label">ENTERPRISE DELIVERY LIFECYCLE &amp; GOVERNANCE</text>

  <!-- 4 Clean Connected Steps -->
  <!-- Step 1 -->
  <g transform="translate(20, 36)">
    <rect width="190" height="68" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="22" class="step-badge">01. DISCOVERY</text>
    <text x="14" y="42" class="step-title">Technical Consulting</text>
    <text x="14" y="58" class="step-sub">Architecture &amp; Feasibility</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 214 70 L 222 70" stroke="#334155" stroke-width="1.5"/>

  <!-- Step 2 -->
  <g transform="translate(226, 36)">
    <rect width="190" height="68" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="22" class="step-badge" fill="#818cf8">02. BUILD</text>
    <text x="14" y="42" class="step-title">Product Engineering</text>
    <text x="14" y="58" class="step-sub">SaaS &amp; High-Volume Core</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 420 70 L 428 70" stroke="#334155" stroke-width="1.5"/>

  <!-- Step 3 -->
  <g transform="translate(432, 36)">
    <rect width="192" height="68" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="22" class="step-badge" fill="#34d399">03. QUALITY &amp; CI/CD</text>
    <text x="14" y="42" class="step-title">Zero-Defect Verification</text>
    <text x="14" y="58" class="step-sub">SonarQube &amp; Multi-Cloud IaC</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 628 70 L 636 70" stroke="#334155" stroke-width="1.5"/>

  <!-- Step 4 -->
  <g transform="translate(640, 36)">
    <rect width="190" height="68" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="22" class="step-badge" fill="#f59e0b">04. ENTERPRISE SCALE</text>
    <text x="14" y="42" class="step-title">Managed SRE Operations</text>
    <text x="14" y="58" class="step-sub">99.99% Availability &amp; AI</text>
  </g>
</svg>
