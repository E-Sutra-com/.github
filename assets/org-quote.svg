<svg width="100%" height="110" viewBox="0 0 850 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="calloutBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
  </defs>

  <style>
    .quote-lead {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #ffffff;
      letter-spacing: 0.1px;
    }
    .quote-cite {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #64748b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>

  <!-- Container -->
  <rect width="850" height="110" rx="8" fill="url(#calloutBg)" stroke="#1e293b" stroke-width="1"/>

  <!-- Left Accent Stripe -->
  <rect x="0" y="0" width="4" height="110" rx="2" fill="#3b82f6"/>

  <!-- Quote Text -->
  <g transform="translate(32, 38)">
    <text x="0" y="0" class="quote-lead">"We engineer the scalable digital foundations that power tomorrow's global enterprises."</text>
    <text x="0" y="32" class="quote-cite">E-Sutra Technologies • ISO 27001 Certified &amp; SOC 2 Type II Compliant</text>
  </g>
</svg>
