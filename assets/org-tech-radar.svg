<svg width="100%" height="115" viewBox="0 0 850 115" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matrixBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
  </defs>

  <style>
    .col-kicker {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .col-primary {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: -0.1px;
    }
    .col-secondary {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      fill: #94a3b8;
    }
  </style>

  <!-- Base Container -->
  <rect width="850" height="115" rx="8" fill="url(#matrixBase)" stroke="#1e293b" stroke-width="1"/>

  <!-- 4 Clean Professional Pillars -->
  <!-- Col 1 -->
  <g transform="translate(20, 16)">
    <rect width="192" height="82" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="col-kicker" fill="#38bdf8">PRODUCT ENGINEERING</text>
    <text x="14" y="46" class="col-primary">React 19 • Next.js 15</text>
    <text x="14" y="66" class="col-secondary">TypeScript • Node • Postgres</text>
  </g>

  <!-- Col 2 -->
  <g transform="translate(224, 16)">
    <rect width="192" height="82" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="col-kicker" fill="#34d399">DIGITAL COMMERCE</text>
    <text x="14" y="46" class="col-primary">Shopify Plus • Magento</text>
    <text x="14" y="66" class="col-secondary">WooCommerce • OpenCart</text>
  </g>

  <!-- Col 3 -->
  <g transform="translate(428, 16)">
    <rect width="198" height="82" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="col-kicker" fill="#818cf8">MULTI-CLOUD &amp; DEVOPS</text>
    <text x="14" y="46" class="col-primary">AWS • GCP • Azure • OCI</text>
    <text x="14" y="66" class="col-secondary">Kubernetes • Docker • IaC</text>
  </g>

  <!-- Col 4 -->
  <g transform="translate(638, 16)">
    <rect width="192" height="82" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="col-kicker" fill="#f59e0b">STRATEGIC AI &amp; AGENTS</text>
    <text x="14" y="46" class="col-primary">Gemini • Claude • OpenAI</text>
    <text x="14" y="66" class="col-secondary">LangChain • Vector Search</text>
  </g>
</svg>
