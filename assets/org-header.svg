<svg width="100%" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1322"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="orgBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="33%" stop-color="#6366f1"/>
      <stop offset="66%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162238"/>
      <stop offset="100%" stop-color="#0d1627"/>
    </linearGradient>

    <pattern id="orgGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    .kicker-tag {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      fill: #38bdf8;
    }
    .org-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .org-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #f1f5f9;
      letter-spacing: 0.3px;
    }
    .card-stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .card-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #cbd5e1;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .glow-edge {
      animation: pulseGlow 3.5s ease-in-out infinite;
    }
  </style>

  <!-- Frame Base -->
  <rect width="850" height="240" rx="14" fill="url(#orgBg)" stroke="#1e293b" stroke-width="1.8"/>
  <rect width="850" height="240" rx="14" fill="url(#orgGrid)"/>

  <!-- Top Window Controls -->
  <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.9"/>
  <circle cx="44" cy="24" r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="60" cy="24" r="5" fill="#10b981" opacity="0.9"/>

  <!-- Kicker Headline -->
  <text x="82" y="28" class="kicker-tag">// ENTERPRISE TECHNOLOGY CONSULTING &amp; PRODUCT ENGINEERING</text>

  <!-- Brand Title -->
  <text x="50%" y="82" text-anchor="middle" class="org-name">E-Sutra Technologies</text>

  <!-- Tagline -->
  <text x="50%" y="112" text-anchor="middle" class="org-subtitle">Engineering the Digital Foundation for Tomorrow's Global Enterprises</text>

  <!-- 4 Trust Metric Cards -->
  <!-- Card 1: 150+ Projects Delivered -->
  <g transform="translate(24, 136)">
    <rect width="188" height="74" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="22" r="4" fill="#38bdf8"/>
    <text x="26" y="26" class="card-stat" fill="#38bdf8">150+ DELIVERED</text>
    <text x="16" y="47" class="card-label">Enterprise Projects</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">90%+ On-Time Velocity</text>
  </g>

  <!-- Card 2: Security & Compliance -->
  <g transform="translate(224, 136)">
    <rect width="188" height="74" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="22" r="4" fill="#10b981"/>
    <text x="26" y="26" class="card-stat" fill="#34d399">ISO 27001 &amp; SOC 2</text>
    <text x="16" y="47" class="card-label">Certified &amp; Compliant</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">GDPR &amp; HIPAA Ready</text>
  </g>

  <!-- Card 3: Multi-Cloud & AI Scale -->
  <g transform="translate(424, 136)">
    <rect width="194" height="74" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="22" r="4" fill="#818cf8"/>
    <text x="26" y="26" class="card-stat" fill="#a5b4fc">MULTI-CLOUD &amp; AI</text>
    <text x="16" y="47" class="card-label">AWS • GCP • Azure • OCI</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">Enterprise GenAI &amp; RAG</text>
  </g>

  <!-- Card 4: Global Reach & Industries -->
  <g transform="translate(630, 136)">
    <rect width="194" height="74" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="22" r="4" fill="#f59e0b"/>
    <text x="26" y="26" class="card-stat" fill="#f59e0b">10+ INDUSTRIES</text>
    <text x="16" y="47" class="card-label">Healthcare • SaaS • Retail</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">FinTech • Logistics • ERP</text>
  </g>

  <!-- Glowing Bottom Edge -->
  <rect x="30" y="235" width="790" height="3" rx="1.5" fill="url(#orgBorderGrad)" class="glow-edge"/>
</svg>
