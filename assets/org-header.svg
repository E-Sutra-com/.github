<svg width="100%" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Executive Deep Slate Background -->
    <linearGradient id="headerBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <!-- Refined Enterprise Subtle Border -->
    <linearGradient id="hairlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Subtle Technical Grid -->
    <pattern id="archGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#131d30" stroke-width="0.65"/>
    </pattern>
  </defs>

  <style>
    .kicker {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.2px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
    .org-brand {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.8px;
      fill: #ffffff;
    }
    .org-tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .stat-val {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.2px;
      fill: #f8fafc;
    }
    .stat-lbl {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #64748b;
      letter-spacing: 0.1px;
    }
  </style>

  <!-- Container Frame -->
  <rect width="850" height="220" rx="10" fill="url(#headerBase)" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="850" height="220" rx="10" fill="url(#archGrid)"/>

  <!-- Top Decorative Clean Accent -->
  <rect x="0" y="0" width="850" height="2" fill="url(#hairlineGrad)"/>

  <!-- Enterprise Header Content (Clean, Left-Aligned Corporate Presentation) -->
  <g transform="translate(36, 34)">
    <!-- Kicker Tag -->
    <text x="0" y="0" class="kicker">ENTERPRISE TECHNOLOGY CONSULTING &amp; PRODUCT ENGINEERING</text>

    <!-- Company Name -->
    <text x="0" y="38" class="org-brand">E-Sutra Technologies</text>

    <!-- Subtitle Line -->
    <text x="0" y="66" class="org-tagline">Architecting mission-critical platforms, high-scale digital commerce, and strategic AI integration.</text>
  </g>

  <!-- 4 Clean Institutional Metric Cards -->
  <g transform="translate(36, 134)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="182" height="60" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="26" class="stat-val" fill="#38bdf8">150+ Projects</text>
    <text x="14" y="45" class="stat-lbl">Delivered Globally</text>

    <!-- Stat 2 -->
    <rect x="198" y="0" width="182" height="60" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="26" class="stat-val" fill="#34d399">ISO 27001 &amp; SOC 2</text>
    <text x="14" y="45" class="stat-lbl">Certified Security</text>

    <!-- Stat 3 -->
    <rect x="396" y="0" width="182" height="60" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="26" class="stat-val" fill="#818cf8">Multi-Cloud</text>
    <text x="14" y="45" class="stat-lbl">AWS • GCP • Azure • OCI</text>

    <!-- Stat 4 -->
    <rect x="594" y="0" width="184" height="60" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="26" class="stat-val" fill="#f59e0b">90%+ Velocity</text>
    <text x="14" y="45" class="stat-lbl">On-Time Sprint Delivery</text>
  </g>
</svg>
